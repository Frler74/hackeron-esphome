esphome:
  name: hackeron-esp
  friendly_name: hackeron-esp
  min_version: 2025.5.0
  name_add_mac_suffix: false

  on_boot:
    priority: -100 # Run after all other components are initialized
    then:
      - delay: 30s # Wait 30 seconds after boot to ensure everything is ready
      - logger.log: "Boot completed - starting BLE scanner"
      - lambda: |-
          id(scanner_active) = true;
          id(akeron_found) = false;
      - script.execute: start_scanning

substitutions:
  #replace here your bluetooth mac address
  mac_akeron: "5C:02:72:30:B6:2C"
  service_uuid: "0bd51666-e7cb-469b-8e4d-2742f1ba77cc"
  characteristic_uuid: "E7ADD780-B042-4876-AAE1-112855353CC1"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

#Enable Home Assistant API
api:
  encryption:
    key: "zTxYwJqDfxLkh7Uo6ZF/9k55EZfdl6zIaEeWB9by3hU="

ota:
  - platform: esphome
    password: "c336d525339f21a3c1d48f6a05402878"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

#Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp-Akeron Fallback Hotspot"
    password: !secret wifi_password

captive_portal:

#bluetooth_proxy:
#  active: true

globals:
  - id: scanner_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: akeron_found
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cover_position
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: cover_moving
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cover_start_time
    type: unsigned long
    restore_value: false
    initial_value: '0'
  - id: cover_direction
    type: int
    restore_value: false
    initial_value: '0'  # 1 = opening, -1 = closing, 0 = stopped
  - id: cover_start_position
    type: float
    restore_value: false
    initial_value: '0.0'

# Scripts for controlling scanning
script:
  - id: start_scanning
    then:
      - if:
          condition:
            lambda: 'return id(scanner_active);'
          then:
            - logger.log: "Starting BLE scan..."
            - esp32_ble_tracker.start_scan:
                continuous: true
  
  - id: stop_scanning
    then:
      - logger.log: "Stopping BLE scan..."
      - esp32_ble_tracker.stop_scan:


esp32_ble_tracker:
  scan_parameters:
    duration: 30s
    interval: 1349ms
    window: 449ms
    active: false

  on_ble_advertise:
      then:
        - lambda: |-
            ESP_LOGD("ble_adv", "New BLE device");
            ESP_LOGD("ble_adv", "  address: %s", x.address_str().c_str());
            ESP_LOGD("ble_adv", "  name: %s", x.get_name().c_str());
            ESP_LOGD("ble_adv", "  Advertised service UUIDs:");
            for (auto uuid : x.get_service_uuids()) {
                ESP_LOGD("ble_adv", "    - %s", uuid.to_string().c_str());
            }
            ESP_LOGD("ble_adv", "  Advertised service data:");
            for (auto data : x.get_service_datas()) {
                ESP_LOGD("ble_adv", "    - %s: (length %i)", data.uuid.to_string().c_str(), data.data.size());
            }
            ESP_LOGD("ble_adv", "  Advertised manufacturer data:");
            for (auto data : x.get_manufacturer_datas()) {
                ESP_LOGD("ble_adv", "    - %s: (length %i)", data.uuid.to_string().c_str(), data.data.size());
            }

ble_client:
  - mac_address: ${mac_akeron}   
    id: akeron
    on_connect:
      then:
        - lambda: |-
            ESP_LOGD("ble_client", "Connected to AKERON!");

        - lambda: |-
            // Stop scanning when connected
            id(scanner_active) = false;
        - script.execute: stop_scanning

    on_disconnect:
      then:
        - lambda: |-
            ESP_LOGD("ble_client", "Disconnected from AKERON");

            // Resume scanning when disconnected
            id(scanner_active) = true;
            id(akeron_found) =  false;
            id(akeron_ph).publish_state(NAN);
            id(akeron_water_temp).publish_state(NAN);
            id(akeron_salt).publish_state(NAN);
            id(akeron_alarm).publish_state(NAN);
            id(akeron_warning).publish_state(NAN);
            id(akeron_elx).publish_state(NAN);
            id(akeron_ph_setpoint).publish_state(NAN);
            id(akeron_boost_time).publish_state(NAN);
            id(akeron_elx_alarm).publish_state(NAN);
            id(akeron_boost).publish_state(false);
            id(akeron_elx_pump).publish_state(false);
            id(akeron_flow_switch).publish_state(false);
            id(akeron_forced_pump).publish_state(false);
            id(akeron_ph_pump).publish_state(false);
            id(akeron_warning_text).publish_state("");
            id(akeron_alarm_text).publish_state("");

        - script.execute: start_scanning

switch:
  - platform: gpio
    pin: GPIO22
    id: relay_opening
    name: "Pool Cover Opening"
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: GPIO23
    id: relay_closing
    name: "Pool Cover Closing"
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: GPIO4
    id: pool_pump
    name: "Pool Pump"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "BLE Scanner"
    id: ble_scanner_switch
    lambda: |-
      return id(scanner_active);
    turn_on_action:
      - lambda: |-
          id(scanner_active) = true;
      - script.execute: start_scanning
    turn_off_action:
      - lambda: |-
          id(scanner_active) = false;
      - script.execute: stop_scanning
  - platform: ble_client
    id: ble_client_switch
    ble_client_id: akeron
    name: "Connect to Akeron Device"

light:
  - platform: binary
    name: "Pool Light"
    id: pool_light
    output: pool_light_output
    restore_mode: RESTORE_DEFAULT_OFF

output:
  - platform: gpio
    pin: GPIO5
    id: pool_light_output


cover:
  - platform: template
    name: "Pool Cover"
    id: pool_cover
    device_class: shutter
    has_position: true
    lambda: |-
      return id(cover_position);
    
    open_action:
      - lambda: |-
          id(cover_moving) = true;
          id(cover_direction) = 1;
          id(cover_start_time) = millis();
          id(cover_start_position) = id(cover_position);
      - switch.turn_off: relay_closing
      - delay: 100ms
      - switch.turn_on: relay_opening
      - delay: 300ms
      - switch.turn_off: relay_opening
      - delay: !lambda 'return (id(pool_cover_open_duration).state * 1000);'
      - lambda: |-
          id(cover_position) = 1.0;
          id(cover_moving) = false;
          id(cover_direction) = 0;
    
    close_action:
      - lambda: |-
          id(cover_moving) = true;
          id(cover_direction) = -1;
          id(cover_start_time) = millis();
          id(cover_start_position) = id(cover_position);
      - switch.turn_off: relay_opening
      - delay: 100ms
      - switch.turn_on: relay_closing
      - delay: 100ms
      - switch.turn_off: relay_closing
      - delay: 100ms
      - switch.turn_on: relay_closing
      - delay: !lambda 'return (id(pool_cover_close_duration).state * 1000);'
      - switch.turn_off: relay_closing
      - lambda: |-
          id(cover_position) = 0.0;
          id(cover_moving) = false;
          id(cover_direction) = 0;
    
    stop_action:
      - lambda: |-
          // Calculate current position before stopping
          if (id(cover_moving)) {
            unsigned long elapsed = millis() - id(cover_start_time);
            float duration_ms = id(cover_direction) == 1 ? 
              (id(pool_cover_open_duration).state * 1000) : 
              (id(pool_cover_close_duration).state * 1000);
            float progress = elapsed / duration_ms;
            
            if (id(cover_direction) == 1) {
              id(cover_position) = min(1.0f, id(cover_position) + progress * (1.0f - id(cover_position)));
            } else {
              id(cover_position) = max(0.0f, id(cover_position) - progress * id(cover_position));
            }
          }
          id(cover_moving) = false;
          id(cover_direction) = 0;
      - switch.turn_off: relay_opening
      - switch.turn_off: relay_closing
      - delay: 100ms
      - switch.turn_on: relay_closing
      - delay: 300ms
      - switch.turn_off: relay_closing
    
    position_action:
      - lambda: |-
          float target_position = pos;
          float current_position = id(cover_position);
          
          ESP_LOGD("pool_cover", "Position action - Current: %.2f, Target: %.2f", current_position, target_position);
          
          if (abs(target_position - current_position) < 0.01) {
            // Already at target position
            ESP_LOGD("pool_cover", "Already at target position");
            return;
          }
          
          id(cover_start_position) = current_position;
          id(cover_start_time) = millis();
          
          if (target_position > current_position) {
            // Need to open
            id(cover_direction) = 1;
            id(cover_moving) = true;
            float distance = target_position - current_position;
            float duration_ms = id(pool_cover_open_duration).state * 1000 * distance;
            
            ESP_LOGD("pool_cover", "Opening for %.0f ms to reach %.2f", duration_ms, target_position);
            
            id(relay_closing)->turn_off();
            delay(100);
            id(relay_opening)->turn_on();
            delay(300);
            id(relay_opening)->turn_off();
            delay(duration_ms);
            
            id(cover_position) = target_position;
            id(cover_moving) = false;
            id(cover_direction) = 0;
          } else {
            // Need to close
            id(cover_direction) = -1;
            id(cover_moving) = true;
            float distance = current_position - target_position;
            float duration_ms = id(pool_cover_close_duration).state * 1000 * distance;
            
            ESP_LOGD("pool_cover", "Closing for %.0f ms to reach %.2f", duration_ms, target_position);
            
            id(relay_opening)->turn_off();
            delay(100);
            id(relay_closing)->turn_on();
            delay(100);
            id(relay_closing)->turn_off();
            delay(100);
            id(relay_closing)->turn_on();
            delay(duration_ms);
            id(relay_closing)->turn_off();
            
            id(cover_position) = target_position;
            id(cover_moving) = false;
            id(cover_direction) = 0;
          }
          id(pool_cover).publish_state();

# Text sensors for device info
text_sensor:
  - platform: template
    name: "Akeron Connection Status"
    id: akeron_connection_status
    lambda: |-
      if (id(akeron).connected()) {
        return {"Connected"};
      } else if (id(akeron_found)) {
        return {"Found - Connecting..."};
      } else if (id(scanner_active)) {
        return {"Scanning..."};
      } else {
        return {"Idle"};
      }
    update_interval: 30s

  - platform: template
    name: "Akeron Alarm Text"
    id: akeron_alarm_text

  - platform: template
    name: "Akeron Warning Text"
    id: akeron_warning_text

# Automation to start scanning on boot
interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return id(cover_moving);'
          then:
            - lambda: |-
                unsigned long elapsed = millis() - id(cover_start_time);
                float duration_ms = id(cover_direction) == 1 ? 
                  (id(pool_cover_open_duration).state * 1000) : 
                  (id(pool_cover_close_duration).state * 1000);
                float progress = min(1.0f, elapsed / duration_ms);
                
                if (id(cover_direction) == 1) {
                  // Opening: progress from current position to 1.0
                  float start_pos = id(cover_start_position);
                  id(cover_position) = start_pos + progress * (1.0f - start_pos);
                  ESP_LOGD("pool_cover", "Opening - Position: %.2f (progress: %.2f)", id(cover_position), progress);
                  
                  // Arrêter automatiquement en fin de course d'ouverture
                  if (progress >= 1.0f) {
                    id(cover_position) = 1.0;
                    id(cover_moving) = false;
                    id(cover_direction) = 0;
                    id(relay_opening)->turn_off();
                    ESP_LOGD("pool_cover", "Opening completed - stopping relay");
                  }
                } else if (id(cover_direction) == -1) {
                  // Closing: progress from current position to 0.0
                  float start_pos = id(cover_start_position);
                  id(cover_position) = start_pos - progress * start_pos;
                  ESP_LOGD("pool_cover", "Closing - Position: %.2f (progress: %.2f)", id(cover_position), progress);
                  
                  // Arrêter automatiquement en fin de course de fermeture
                  if (progress >= 1.0f) {
                    id(cover_position) = 0.0;
                    id(cover_moving) = false;
                    id(cover_direction) = 0;
                    id(relay_closing)->turn_off();
                    ESP_LOGD("pool_cover", "Closing completed - stopping relay");
                  }
                }
                id(pool_cover).publish_state();

  - interval: 60s
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(scanner_active);'
              - lambda: 'return !id(akeron).connected();'
          then:
            - lambda: 'ESP_LOGD("ble_scanner", "Periodic scan check - ensuring scanner is active");'
            - script.execute: start_scanning

  - interval: 30s
    then:
      - if:
          condition:
              - lambda: 'return id(akeron).connected();'
          then:
            - lambda: 'ESP_LOGD("data_request", "BLE Data Request");'
            #trame M 10
            - ble_client.ble_write:
                service_uuid: ${service_uuid}
                characteristic_uuid: ${characteristic_uuid}
                value: [ 42, 82, 63, 77, 10, 42]

            - delay: 5s
            #trame S 83
            - ble_client.ble_write:
                service_uuid: ${service_uuid}
                characteristic_uuid: ${characteristic_uuid}
                value: [ 42, 82, 63, 83, 20, 42]

            - delay: 5s
            #trame A 65
            - ble_client.ble_write:
                service_uuid: ${service_uuid}
                characteristic_uuid: ${characteristic_uuid}
                value: [ 42, 82, 63, 65, 6, 42]

            - delay: 5s
            #trame E 69
            - ble_client.ble_write:
                service_uuid: ${service_uuid}
                characteristic_uuid: ${characteristic_uuid}
                value: !lambda |- 
                  std::vector<unsigned char> result { 42,82,63,69,255,42 };
                  //calcul CRC
                  uint8_t crc = 0;
                  for( int c=0; c < result.size()-2; c++){
                    crc =(uint8_t) (crc ^ result[c]);     // ^ou eclusif bit a bit
                  }
                  result[ result.size()-2 ] = crc;
                  //end CRC
                  return result;

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Pool Cover Contact"
    id: pool_cover_contact
    device_class: opening
    on_press:
      then:
        - lambda: |-
            ESP_LOGD("pool_cover", "Physical switch turned to OPEN - Starting opening tracking");
            // La clef active directement le moteur, on track juste le mouvement
            if (id(cover_position) < 1.0) {
              id(cover_moving) = true;
              id(cover_direction) = 1;
              id(cover_start_time) = millis();
              id(cover_start_position) = id(cover_position);
            }
    on_release:
      then:
        - lambda: |-
            ESP_LOGD("pool_cover", "Physical switch turned to CLOSE - Stopping and preparing for closing");
            // Arrêter le tracking du mouvement en cours
            if (id(cover_moving)) {
              // Calculer la position actuelle
              unsigned long elapsed = millis() - id(cover_start_time);
              float duration_ms = id(cover_direction) == 1 ? 
                (id(pool_cover_open_duration).state * 1000) : 
                (id(pool_cover_close_duration).state * 1000);
              float progress = elapsed / duration_ms;
              
              if (id(cover_direction) == 1) {
                id(cover_position) = min(1.0f, id(cover_position) + progress * (1.0f - id(cover_position)));
              } else if (id(cover_direction) == -1) {
                id(cover_position) = max(0.0f, id(cover_position) - progress * id(cover_position));
              }
              
              id(cover_moving) = false;
              id(cover_direction) = 0;
              id(pool_cover).publish_state();
            }
            
            // Attendre un peu que l'utilisateur remette la clef sur neutre puis sur close
            delay(1000);
            
            // Démarrer le tracking de la fermeture
            if (id(cover_position) > 0.0) {
              id(cover_moving) = true;
              id(cover_direction) = -1;
              id(cover_start_time) = millis();
              id(cover_start_position) = id(cover_position);
              ESP_LOGD("pool_cover", "Starting closing tracking");
            }

  - platform: template
    name: "Akeron Flow Switch"
    id: akeron_flow_switch

  - platform: template
    name: "Akeron PH Pump"
    id: akeron_ph_pump

  - platform: template
    name: "Akeron ELX Pump"
    id: akeron_elx_pump

  - platform: template
    name: "Akeron Forced Pump"
    id: akeron_forced_pump

  - platform: template
    name: "Akeron Boost 2h"
    id: akeron_boost

  - platform: ble_presence
    mac_address: ${mac_akeron} 
    name: "Akeron Device Present"
    id: akeron_present
    on_press:
      then:
        - lambda: |-
            ESP_LOGD("akeron_present", "Akeron device found! Attempting connection...");
            id(akeron_found) = true;
        - ble_client.connect: akeron
    on_release:
      then:
        - lambda: |-
            ESP_LOGD("akeron_present", "Akeron device no longer detected");
            id(akeron_found) = false;

